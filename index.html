  <!--Hero Section-->
  <section class="hero-section d-flex align-items-center" id="hero">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 mx-auto text-center text-white">
          <h1 class="display-1 fw-bold mb-3">Welcome to <span class="text-gold">Luxury</span></h1>
          <p class="lead mb-4">Experience unparalleled elegance and world-class hospitality at Nairobi's finest boutique hotel.</p>
          <div class="d-flex flex-wrap justify-content-center gap-3">
            <a href="pages/rooms.html" class="btn btn-gold btn-lg">
              <i class="bi bi-calendar-check me-2"></i>Book Your Stay</a>
            <a href="pages/about.html" class="btn btn-outline-light btn-lg">
              <i class="bi bi-play-circle me-2"></i>Explore More
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!--QUICK BOOKING BAR-->
  <section class="bg-forest py-4" aria-label="Quick booking form">
    <div class="container">
      <form class="row g-3 align-items-end" id="quickBookForm" novalidate>
        <div class="col-12 col-md-3">
          <label class="form-label text-white small fw-bold" for="checkIn">Check-In</label>
          <input type="date" class="form-control" id="checkIn" required />
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label text-white small fw-bold" for="checkOut">Check-Out</label>
          <input type="date" class="form-control" id="checkOut" required />
        </div>
        <div class="col-12 col-md-2">
          <label class="form-labeltext-white small fw-bold" for="guests">Guests</label>
          <select class="form-select" id="guests">
            <option value="1" selected>1 Guest</option>
            <option value="2" >2 Guests</option>
            <option value="3">3 Guests</option>
            <option value="4">4 Guests</option>
          </select>
        </div>
        <div class="col-12 col-md-2">
          <label class="form-label text-white small fw-bold" for="roomType">Room Type</label>
          <select class="form-select" id="roomType">
            <option value="any">Any</option>
            <option value="classic">Classic</option>
            <option value="deluxe">Deluxe</option>
            <option value="suite">Suite</option>
          </select>
        </div>
        <div class="col-12 col-md-2">
          <button type="submit" class="btn btn-gold w-100">Check Availability</button>
        </div>
      </form>
    </div>
  </section>
